name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'latest'

      - name: Install ChromeDriver
        uses: browser-actions/setup-chromedriver@v1
        with:
          chromedriver-version: 'latest'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run test site
        run: |
          docker run -d -p 8080:80 --name test-site nginx:alpine
          docker cp index.html test-site:/usr/share/nginx/html/index.html

      - name: Wait for site
        run: sleep 5

      - name: Run tests
        run: |
          pytest tests/test_all.py -v --maxfail=1