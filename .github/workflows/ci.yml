name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove old ChromeDriver and install correct version
        run: |
          # Удаляем старый ChromeDriver
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver
          
          # Устанавливаем Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # Устанавливаем ChromeDriver через webdriver-manager (без npm)
          pip install webdriver-manager

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run test site
        run: |
          docker run -d -p 8080:80 --name test-site nginx:alpine
          docker cp index.html test-site:/usr/share/nginx/html/index.html

      - name: Wait for site
        run: sleep 5

      - name: Run tests
        run: |
          pytest tests/test_all.py -v --maxfail=1