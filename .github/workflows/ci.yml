name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest allure-pytest webdriver-manager

      - name: Run test site
        run: |
          docker run -d -p 8080:80 --name test-site nginx:alpine
          docker cp index.html test-site:/usr/share/nginx/html/index.html

      - name: Wait for site
        run: sleep 5

      - name: Run tests
        run: |
          pytest tests/test_all.py -v --maxfail=1 --alluredir=allure-results

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure-2.30.0.tgz
          sudo mv allure-2.30.0 /opt/allure
          echo 'export PATH=$PATH:/opt/allure/bin' >> $GITHUB_PATH

      - name: Generate report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report