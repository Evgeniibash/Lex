name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and ChromeDriver
        run: |
          # Установка Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # Установка ChromeDriver через webdriver-manager
          sudo apt-get install -y npm
          sudo npm install -g webdriver-manager
          sudo webdriver-manager update --versions.chrome=latest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest webdriver-manager

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run test site
        run: |
          docker run -d -p 8080:80 --name test-site nginx:alpine
          docker cp index.html test-site:/usr/share/nginx/html/index.html

      - name: Wait for site
        run: sleep 5

      - name: Run tests
        run: |
          pytest tests/test_all.py -v --maxfail=1