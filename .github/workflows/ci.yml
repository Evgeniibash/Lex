name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest webdriver-manager

      - name: Run test site
        run: |
          docker run -d -p 8080:80 --name test-site nginx:alpine
          docker cp index.html test-site:/usr/share/nginx/html/index.html

      - name: Wait for site
        run: sleep 5

      - name: Run tests
        run: |
          python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"
          pytest tests/test_all.py -v --maxfail=1